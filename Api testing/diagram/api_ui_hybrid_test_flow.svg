<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<title>API and UI hybrid test flow</title>
<desc>Diagram showing how the test creates an order via API then verifies it via UI login</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect width="680" height="620" fill="#ffffff"/>

<rect x="40" y="20" width="600" height="230" rx="20" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<text x="60" y="46" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">API side (APIUtils class)</text>

<g>
<rect x="70" y="70" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="150" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Login via API</text>
<text x="150" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">POST /auth/login</text>
</g>

<line x1="230" y1="98" x2="268" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="270" y="70" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="350" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Get token</text>
<text x="350" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">from response body</text>
</g>

<line x1="430" y1="98" x2="468" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="470" y="70" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="545" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Create order</text>
<text x="545" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">POST /create-order</text>
</g>

<line x1="545" y1="126" x2="545" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="440" y="162" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="530" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">orderId returned</text>
<text x="530" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">orders[0] from response</text>
</g>

<line x1="530" y1="250" x2="530" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="595" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">bridge</text>

<rect x="40" y="300" width="600" height="290" rx="20" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<text x="60" y="326" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">UI side (browser test)</text>

<g>
<rect x="70" y="350" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="150" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Login via UI</text>
<text x="150" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">fill email, password</text>
</g>

<line x1="230" y1="378" x2="268" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="270" y="350" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="345" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Open orders tab</text>
<text x="345" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">click ORDERS</text>
</g>

<line x1="420" y1="378" x2="458" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="460" y="350" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="540" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Find row</text>
<text x="540" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">filter by orderId</text>
</g>

<line x1="540" y1="406" x2="540" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="440" y="442" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="540" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Click View</text>
<text x="540" y="484" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">opens order details</text>
</g>

<line x1="440" y1="470" x2="290" y2="470" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="90" y="442" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="190" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">Assert tagline</text>
<text x="190" y="484" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">"Thank you for Shopping"</text>
</g>

<text x="360" y="560" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">orderId created via API is the value used to locate the row in the UI</text>
</svg>
